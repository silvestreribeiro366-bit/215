<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>USOX</title>
    <!-- Global CDN builds -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /* ===== CSS variables (theme: Soft Gradient #10) ===== */
        :root {
            --bg: #f4f7fc;
            --surface: #ffffff;
            --surface-soft: #f0f4fa;
            --text-primary: #1e2b3c;
            --text-secondary: #5b6f84;
            --text-muted: #8a9bb0;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #5f9df7, #8b7bf7);
            --rise: #e06b6b;
            --rise-bg: #fde8e8;
            --fall: #4a9b9b;
            --fall-bg: #e2f0f0;
            --border: #e3eaf2;
            --radius-card: 18px;
            --radius-pill: 50px;
            --shadow-sm: 0 4px 12px rgba(0, 20, 50, 0.06);
            --shadow-md: 0 8px 24px rgba(0, 20, 50, 0.10);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --tab-bar-height: 62px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
        }

        body {
            font-family: var(--font);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== scroll wrapper ===== */
        .page-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-top: var(--safe-top);
            scroll-behavior: smooth;
        }

        .page-scroll.with-tab {
            padding-bottom: calc(var(--tab-bar-height) + var(--safe-bottom) + 8px);
        }

        .page-scroll.no-tab {
            padding-bottom: calc(var(--safe-bottom) + 16px);
        }

        /* ===== transitions ===== */
        .fade-enter-active,
        .fade-leave-active {
            transition: opacity 0.22s ease;
        }

        .fade-enter-from,
        .fade-leave-to {
            opacity: 0;
        }

        /* ===== tab bar ===== */
        .tab-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--tab-bar-height);
            padding-bottom: var(--safe-bottom);
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-width: 64px;
            height: 48px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            transition: color 0.2s;
            position: relative;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tab-item.router-link-active {
            color: var(--accent);
        }

        .tab-item.router-link-active::after {
            content: '';
            position: absolute;
            top: 0;
            width: 20px;
            height: 3px;
            border-radius: 3px;
            background: var(--accent-gradient);
        }

        /* ===== loading ===== */
        .loading-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
            background: var(--bg);
        }

        .loading-logo {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
        }

        .loading-logo span {
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        /* ===== shared page ===== */
        .page {
            padding: 16px 16px 0;
        }

        .page-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .page-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 18px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            background: none;
            border: none;
            padding: 8px 0;
            min-height: 44px;
            cursor: pointer;
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chip {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            letter-spacing: 0.2px;
        }

        .chip.rise {
            color: var(--rise);
            background: var(--rise-bg);
        }

        .chip.fall {
            color: var(--fall);
            background: var(--fall-bg);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--surface-soft);
            font-size: 16px;
            /* prevent zoom on focus */
            color: var(--text-primary);
            font-family: var(--font);
            outline: none;
            min-height: 44px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .field {
            margin-bottom: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 48px;
            padding: 12px 20px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--font);
            background: var(--accent-gradient);
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.4;
            box-shadow: none;
            transform: none;
        }

        .btn-ghost {
            background: var(--surface-soft);
            color: var(--text-primary);
            box-shadow: none;
            border: 1px solid var(--border);
        }

        .btn-sm {
            min-height: 40px;
            font-size: 14px;
            padding: 8px 16px;
            width: auto;
            border-radius: 10px;
        }

        /* ===== Home brand ===== */
        .brand-header {
            padding: 20px 4px 14px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .brand-icon span {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .brand-tagline {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0 20px;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px 14px;
            background: var(--surface);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.12s;
            text-decoration: none;
            color: inherit;
        }

        .feature-item:active {
            transform: scale(0.97);
        }

        .feature-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: var(--surface-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        .feature-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .feature-label {
            font-size: 13px;
            font-weight: 700;
        }

        /* ===== stock list ===== */
        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .list-title {
            font-size: 17px;
            font-weight: 800;
        }

        .stock-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            background: var(--surface);
            border-radius: 14px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.15s;
            text-decoration: none;
            color: inherit;
            min-height: 60px;
        }

        .stock-row:active {
            background: var(--surface-soft);
        }

        .stock-sym {
            font-size: 15px;
            font-weight: 800;
            width: 58px;
            flex-shrink: 0;
        }

        .stock-name {
            flex: 1;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .stock-price {
            font-size: 15px;
            font-weight: 700;
            text-align: right;
            width: 62px;
            flex-shrink: 0;
        }

        .stock-chg {
            font-size: 13px;
            font-weight: 700;
            text-align: right;
            width: 58px;
            flex-shrink: 0;
        }

        .rise-color {
            color: var(--rise);
        }

        .fall-color {
            color: var(--fall);
        }

        /* ===== detail chart ===== */
        .chart-box {
            width: 100%;
            overflow: hidden;
            background: var(--surface);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            padding: 12px 8px 8px;
            margin: 14px 0;
        }

        .chart-box svg {
            width: 100%;
            height: 180px;
            display: block;
        }

        .detail-price-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 8px 0 2px;
        }

        .detail-price {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .detail-chg {
            font-size: 16px;
            font-weight: 700;
        }

        /* ===== toolbox ===== */
        .tool-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .tool-tabs::-webkit-scrollbar {
            display: none;
        }

        .tool-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            min-height: 38px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tool-tab.active {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 3px 10px rgba(59, 130, 246, 0.3);
        }

        .tool-panel {
            background: var(--surface);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            padding: 18px 16px;
            margin-bottom: 14px;
        }

        .result-box {
            background: var(--surface-soft);
            border-radius: 12px;
            padding: 14px;
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.8;
            border: 1px solid var(--border);
        }

        .result-box strong {
            color: var(--accent);
        }

        /* calendar */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 10px;
        }

        .cal-head {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            background: var(--surface-soft);
            border: 1px solid transparent;
            position: relative;
            min-height: 38px;
        }

        .cal-cell.empty {
            background: transparent;
            border: none;
        }

        .cal-cell.today {
            border-color: var(--accent);
        }

        .cal-cell.marked {
            background: #dbeafe;
            color: var(--accent);
        }

        .cal-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: 2px;
        }

        /* inbox modal */
        .modal-mask {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            backdrop-filter: blur(4px);
        }

        .modal-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 22px;
            max-width: 360px;
            width: 100%;
            box-shadow: var(--shadow-md);
        }

        .modal-card h3 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .modal-card p {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 18px;
        }

        /* settings */
        .settings-group {
            background: var(--surface);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .settings-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 16px;
            min-height: 54px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            background: var(--surface);
            transition: background 0.15s;
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-item:active {
            background: var(--surface-soft);
        }

        .settings-item svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: var(--accent);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .settings-item .label {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
        }

        .settings-item .value {
            font-size: 13px;
            color: var(--text-muted);
        }

        .chev {
            color: var(--text-muted);
            font-size: 18px;
            margin-left: auto;
        }

        /* toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(var(--tab-bar-height) + var(--safe-bottom) + 24px);
            transform: translateX(-50%);
            z-index: 300;
            background: rgba(30, 43, 60, 0.94);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-md);
            pointer-events: none;
            max-width: 80%;
            text-align: center;
        }

        .toast-enter-active,
        .toast-leave-active {
            transition: opacity 0.25s, transform 0.25s;
        }

        .toast-enter-from,
        .toast-leave-to {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
        }

        /* article */
        .article-body h2 {
            font-size: 20px;
            font-weight: 800;
            margin: 18px 0 8px;
        }

        .article-body h3 {
            font-size: 17px;
            font-weight: 700;
            margin: 16px 0 6px;
        }

        .article-body p {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .article-body ul {
            padding-left: 20px;
            margin-bottom: 12px;
        }

        .article-body li {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .muted {
            color: var(--text-muted);
            font-size: 13px;
        }

        .flex-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .mt-12 {
            margin-top: 12px;
        }

        .mb-12 {
            margin-bottom: 12px;
        }

        .text-center {
            text-align: center;
        }

        .green {
            color: var(--fall);
        }

        .red {
            color: var(--rise);
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view v-slot="{ Component }">
            <transition name="fade" mode="out-in">
                <component :is="Component" />
            </transition>
        </router-view>
    </div>

    <script>
        // ============================================================
        // HOW TO ADD A NEW PAGE:
        // 1. Add a route object in `routes` array: { path, name, component }
        // 2. Define a new component (e.g., const MyPage = { template: `...` })
        // 3. Add <router-link> in TabBar or any navigation area if needed.
        // ============================================================

        const { createApp, ref, reactive, computed, onMounted, watch } = Vue;
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        // ============================================================
        // 1. BUILT-IN STOCK DATA (static, offline)
        // ============================================================
        const STOCK_POOL = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 189.84, change: 1.24 },
            { symbol: 'MSFT', name: 'Microsoft Corp.', price: 415.32, change: -0.87 },
            { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 175.23, change: 0.65 },
            { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 186.45, change: 2.13 },
            { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 881.86, change: 3.42 },
            { symbol: 'META', name: 'Meta Platforms', price: 502.31, change: -1.56 },
            { symbol: 'TSLA', name: 'Tesla Inc.', price: 171.05, change: -2.84 },
            { symbol: 'BRK.B', name: 'Berkshire Hathaway', price: 403.77, change: 0.34 },
            { symbol: 'JPM', name: 'JPMorgan Chase', price: 196.12, change: 0.92 },
            { symbol: 'V', name: 'Visa Inc.', price: 279.44, change: -0.41 },
            { symbol: 'UNH', name: 'UnitedHealth', price: 492.18, change: 1.78 },
            { symbol: 'XOM', name: 'Exxon Mobil', price: 113.52, change: -1.12 },
            { symbol: 'JNJ', name: 'Johnson & Johnson', price: 147.09, change: 0.28 },
            { symbol: 'WMT', name: 'Walmart Inc.', price: 60.34, change: 1.05 },
            { symbol: 'PG', name: 'Procter & Gamble', price: 162.77, change: -0.63 },
            { symbol: 'MA', name: 'Mastercard Inc.', price: 456.90, change: 0.77 },
            { symbol: 'HD', name: 'Home Depot', price: 345.21, change: -1.34 },
            { symbol: 'CVX', name: 'Chevron Corp.', price: 156.88, change: 0.45 },
            { symbol: 'LLY', name: 'Eli Lilly', price: 775.63, change: 2.56 },
            { symbol: 'ABBV', name: 'AbbVie Inc.', price: 178.42, change: -0.82 },
            { symbol: 'PEP', name: 'PepsiCo Inc.', price: 172.15, change: 0.19 },
            { symbol: 'KO', name: 'Coca-Cola Co.', price: 62.37, change: -0.55 }
        ];

        // Generate a 30-day price curve based on last price & change
        function genCurve(base, changePct) {
            const points = [];
            const days = 30;
            const trend = changePct / 100;
            let val = base / (1 + trend * 0.6);
            for (let i = 0; i < days; i++) {
                const noise = (Math.sin(i * 1.3) + Math.cos(i * 0.7)) * base * 0.012;
                const drift = (base - val) * (i / days) * 0.3;
                val = val + noise + drift + (Math.random() - 0.5) * base * 0.008;
                points.push(Math.max(val, base * 0.7));
            }
            points[days - 1] = base;
            return points;
        }

        function buildStockData() {
            return STOCK_POOL.map(s => {
                const curve = genCurve(s.price, s.change);
                return {
                    ...s,
                    curve,
                    high: Math.max(...curve),
                    low: Math.min(...curve)
                };
            });
        }

        const ALL_STOCKS = buildStockData();

        // Shuffle array copy
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {

                const calendarCells = computed(() => {
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = now.getMonth();
                    const firstDay = new Date(year, month, 1).getDay();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    const cells = [];
                    for (let i = 0; i < firstDay; i++) cells.push({ day: null, isToday: false, marked: false });
                    const entry = cal.entryDate ? new Date(cal.entryDate) : null;
                    const maturity = maturityDate.value !== '—' ? new Date(maturityDate.value) : null;
                    for (let d = 1; d <= daysInMonth; d++) {
                        const cur = new Date(year, month, d);
                        const marked = (entry && cur.getTime() === entry.getTime()) || (maturity && cur.getTime() === maturity.getTime());
                        cells.push({ day: d, isToday: d === now.getDate(), marked: !!marked });
                    }
                    return cells;
                });

                // Loan
                const loan = reactive({ amount: 10000, rate: 5, months: 12, method: 'equal' });
                const monthlyPayment = computed(() => {
                    const p = loan.amount || 0;
                    const r = (loan.rate || 0) / 100 / 12;
                    const n = loan.months || 1;
                    if (loan.method === 'equal') {
                        if (r === 0) return (p / n).toFixed(2);
                        const m = p * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
                        return m.toFixed(2);
                    } else {
                        // equal principal: first month payment
                        return (p / n + p * r).toFixed(2);
                    }
                });
                const totalInterest = computed(() => {
                    const p = loan.amount || 0;
                    const r = (loan.rate || 0) / 100 / 12;
                    const n = loan.months || 1;
                    if (loan.method === 'equal') {
                        if (r === 0) return '0.00';
                        const m = p * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
                        return (m * n - p).toFixed(2);
                    } else {
                        let interest = 0;
                        for (let i = 0; i < n; i++) {
                            interest += (p - (p / n) * i) * r;
                        }
                        return interest.toFixed(2);
                    }
                });

                // Profit
                const profit = reactive({ cost: 10, price: 15, qty: 100 });
                const profitVal = computed(() => (profit.price - profit.cost) * profit.qty);

                // Reverse Yield
                const ry = reactive({ target: 1000, principal: 10000, months: 12 });
                const requiredRate = computed(() => {
                    if (!ry.principal || !ry.months) return '0.00';
                    const r = (ry.target / ry.principal) / (ry.months / 12) * 100;
                    return r.toFixed(2);
                });

                // Password
                const pwd = reactive({ input: '' });
                const pwdScore = computed(() => {
                    const v = pwd.input;
                    let s = 0;
                    if (v.length >= 8) s++;
                    if (/[A-Z]/.test(v)) s++;
                    if (/[a-z]/.test(v)) s++;
                    if (/[0-9]/.test(v)) s++;
                    if (/[^A-Za-z0-9]/.test(v)) s++;
                    return s;
                });
                const pwdStrength = computed(() => {
                    const s = pwdScore.value;
                    if (s <= 1) return { label: 'Very Weak', color: 'red' };
                    if (s === 2) return { label: 'Weak', color: 'red' };
                    if (s === 3) return { label: 'Fair', color: '' };
                    if (s === 4) return { label: 'Strong', color: 'green' };
                    return { label: 'Very Strong', color: 'green' };
                });
                const md5Digest = computed(() => {
                    if (!pwd.input) return '—';
                    try { return md5(pwd.input); } catch (e) { return '—'; }
                });

                // Credit Memo
                const memo = reactive({ name: '', amount: 0, due: '' });
                const memos = ref(getItem(STORAGE_KEYS.CREDIT_MEMO, []));
                function saveMemo() {
                    if (!memo.name || !memo.amount || !memo.due) {
                        showToast('Please fill all fields');
                        return;
                    }
                    const due = new Date(memo.due);
                    const now = new Date();
                    const daysLeft = Math.max(0, Math.ceil((due - now) / 86400000));
                    memos.value.push({ name: memo.name, amount: memo.amount, due: memo.due, daysLeft });
                    setItem(STORAGE_KEYS.CREDIT_MEMO, memos.value);
                    showToast('Memo saved');
                    memo.name = ''; memo.amount = 0; memo.due = '';
                }

                return {
                    tools, activeTool,
                    dca, targetValue, pnl,
                    cal, maturityDate, calendarCells,
                    loan, monthlyPayment, totalInterest,
                    profit, profitVal,
                    ry, requiredRate,
                    pwd, pwdScore, pwdStrength, md5Digest,
                    memo, memos, saveMemo
                };
            }

                        <back-btn :to="{ name: 'settings' }" />
                        <div class="page-title" style="margin-top:4px;">Monthly Check-in</div>
                        <div class="page-sub">{{ monthLabel }}</div>
                        <div class="card">

                </div>

                const now = new Date();

                const monthLabel = now.toLocaleString('en-US', { month: 'long', year: 'numeric' });
                const key = STORAGE_KEYS.CHECKIN + year + '-' + (month + 1);

                const checkedDays = ref(getItem(key, []));
                const today = now.getDate();
                const checkedToday = computed(() => checkedDays.value.includes(today));

                const cells = computed(() => {
                    const firstDay = new Date(year, month, 1).getDay();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    const arr = [];
                    for (let i = 0; i < firstDay; i++) arr.push({ day: null, isToday: false, checked: false });
                    for (let d = 1; d <= daysInMonth; d++) {
                        arr.push({ day: d, isToday: d === today, checked: checkedDays.value.includes(d) });
                    }
                    return arr;

                    if (checkedToday.value) return;
