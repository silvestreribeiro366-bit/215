<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIC55 · loading</title>
  <style>
    /* 全局重置 + 黑色纯净背景 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;        /* 深邃黑，非纯黑保留层次感 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      /* 黑色背景，极简无干扰 */
    }

    /* 加载页主容器 — 纯黑卡片，无边框无阴影 */
    .loading-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 2rem;
      text-align: center;
      background: transparent;    /* 融入纯黑背景 */
      user-select: none;
    }

    /* MIC55 主标识 — 黑色背景上使用近白色，清晰醒目 */
    .brand {
      font-size: 5rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #f0f0f0;            /* 柔和白，避免刺眼 */
      line-height: 1.2;
      margin-bottom: 0.5rem;
      /* 轻微的字重对比，稳重有力 */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 辅助英文标签 — 低调的灰，与主标识形成层次 */
    .brand-sub {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: #7a7a7a;            /* 中灰色，在黑色背景下可读但不抢眼 */
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    /* 加载动画容器 */
    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      width: 100%;
      max-width: 360px;
    }

    /* 跳动的三个点 — 在黑色背景上使用亮白/浅灰 */
    .dots-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
    }

    .dot {
      width: 14px;
      height: 14px;
      background: #e0e0e0;       /* 浅灰白圆点，与黑色背景高对比 */
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.4s infinite ease-in-out both;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.15); /* 极轻微光晕，提升质感 */
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    .dot:nth-child(3) {
      animation-delay: 0s;
    }

    /* 弹跳动画 — 柔和且循环 */
    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 1;
      }
      40% {
        transform: translateY(-14px);
        opacity: 0.7;
      }
    }

    /* 加载英文文案 — 纯正英文，符合语境 */
    .loading-text {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: #9a9a9a;            /* 中灰白，保持可读性 */
      text-transform: uppercase;
      margin-top: 0.25rem;
      -webkit-font-smoothing: antialiased;
    }

    /* 极简进度条 — 在黑色背景上用暗灰轨道 + 白色填充 */
    .progress-track {
      width: 100%;
      height: 2px;
      background: #2a2a2a;        /* 深灰轨道，与黑色背景区分 */
      border-radius: 2px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-fill {
      width: 30%;
      height: 100%;
      background: #e0e0e0;        /* 亮色填充，醒目 */
      border-radius: 2px;
      animation: slide 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      transform-origin: left center;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2); /* 微光让进度条更有生气 */
    }

    @keyframes slide {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(200%);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    /* 响应式微调 */
    @media (max-width: 480px) {
      .brand {
        font-size: 3.8rem;
      }
      .brand-sub {
        font-size: 0.9rem;
        letter-spacing: 0.2em;
        margin-bottom: 2rem;
      }
      .dot {
        width: 12px;
        height: 12px;
      }
      .loader-wrapper {
        max-width: 280px;
      }
    }
  </style>
</head>
<body>
  <!-- 纯黑背景上的加载页 · 品牌 MIC55 -->
  <div class="loading-page" role="status" aria-live="polite" aria-label="Loading MIC55">
    
    <!-- 主标识 -->
    <div class="brand">MIC55</div>
    <!-- 辅助英文标签，英文加载语境 -->
    <div class="brand-sub">Loading</div>

    <!-- 加载指示器 + 英文说明 -->
    <div class="loader-wrapper">
      <!-- 三个跳动圆点 -->
      <div class="dots-loader" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <!-- 英文加载文字 -->
      <div class="loading-text">Please wait</div>

      <!-- 极简进度动画（纯视觉提示） -->
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>
</body>
